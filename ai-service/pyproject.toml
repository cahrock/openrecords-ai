[tool.poetry]
name = "openrecords-ai-service"
version = "0.1.0"
description = "AI service for OpenRecords - classification, embeddings, RAG"
authors = ["cahrock"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "0.115.0"
uvicorn = {extras = ["standard"], version = "0.30.6"}
pydantic = "2.9.0"
pydantic-settings = "2.5.2"
anthropic = "0.34.0"
langchain = "0.3.0"
langchain-anthropic = "0.2.0"
psycopg2-binary = "2.9.9"
pgvector = "0.3.2"
sqlalchemy = "2.0.35"
httpx = "0.27.2"

[tool.poetry.group.dev.dependencies]
pytest = "8.3.3"
pytest-asyncio = "0.24.0"
ruff = "0.6.9"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"