services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: openrecords-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-openrecords}
      POSTGRES_USER: ${POSTGRES_USER:-openrecords}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openrecords_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - openrecords_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openrecords} -d ${POSTGRES_DB:-openrecords}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: openrecords-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

  mailhog:
    image: mailhog/mailhog:latest
    container_name: openrecords-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  ai-service:
    build:
      context: ../ai-service
      dockerfile: Dockerfile
    container_name: openrecords-ai-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-openrecords}:${POSTGRES_PASSWORD:-openrecords_dev_password}@postgres:5432/${POSTGRES_DB:-openrecords}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-20250514}
      API_BASE_URL: ${API_BASE_URL:-http://host.docker.internal:8080}
      API_SERVICE_TOKEN: ${API_SERVICE_TOKEN:-}
      DEBUG: ${DEBUG:-true}
    ports:
      - "8001:8001"
    volumes:
      - ../ai-service/app:/app/app
    depends_on:
      postgres:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ../ai-service/app
          target: /app/app

volumes:
  openrecords_postgres_data:
    external: true
    name: openrecords_postgres_data
  pgadmin_data:
    name: openrecords_pgadmin_data